<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>찌공이 단어장</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f1f3f4">
<meta name="referrer" content="no-referrer">
<style>
:root {
  --bg: #f1f3f4;
  --surface: #ffffff;
  --text: #202124;
  --muted: #5f6368;
  --border: #dadce0;
  --accent: #1a73e8;
  --accent-bg: #e8f0fe;
  --danger: #d93025;
  --ok: #137333;
  --warn: #b06000;
  --r0: #fce8e6; --r1: #fef7e0; --r2: #e6f4ea;
  --field: #ffffff;
  --shadow: 0 1px 3px rgba(60,64,67,.25);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #202124; --surface: #202124; --text: #e8eaed; --muted: #9aa0a6;
    --border: #5f6368; --accent: #8ab4f8; --accent-bg: #394457; --danger: #f28b82;
    --ok: #81c995; --warn: #fdd663; --r0: #5c2b29; --r1: #594a1d; --r2: #1e4630;
    --field: #2d2e31;
    --shadow: 0 1px 3px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Malgun Gothic", sans-serif;
  min-height: 100vh;
}
button { -webkit-tap-highlight-color: transparent; }
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding: 10px 12px 8px;
}
.tabs { display: flex; background: var(--field); border-radius: 22px; padding: 3px; box-shadow: var(--shadow); margin-bottom: 10px; }
.tabs button {
  flex: 1; border: none; background: transparent; color: var(--muted); font: inherit; font-size: 15px;
  padding: 9px 0; border-radius: 19px; cursor: pointer;
}
.tabs button.on { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.hrow { display: flex; gap: 8px; align-items: center; }
.hrow[hidden] { display: none; }
.search {
  flex: 1; min-width: 0; height: 48px; border: none; border-radius: 24px;
  background: var(--field); color: var(--text); padding: 0 20px; font-size: 16px;
  box-shadow: var(--shadow); outline: none;
}
.search::placeholder { color: var(--muted); }
select {
  height: 48px; border: none; border-radius: 24px; background: var(--field); color: var(--text);
  padding: 0 10px; font-size: 14px; box-shadow: var(--shadow); max-width: 112px;
}
.pills { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.pills::-webkit-scrollbar { display: none; }
.pill {
  flex: none; border: 1px solid var(--border); background: var(--field); color: var(--muted);
  border-radius: 18px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer;
}
.pill.on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.ic {
  flex: none; width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--field); color: var(--text); box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
}
.ic svg { width: 20px; height: 20px; }
.ic[hidden] { display: none; }
main { padding: 6px 12px 110px; }
section[hidden] { display: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; align-items: start; }
.card {
  display: block; width: 100%; text-align: left;
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 14px 10px; cursor: pointer;
  font: inherit; line-height: 1.5;
}
.card h3 { margin: 0 0 4px; font-size: 20px; font-weight: 600; word-break: break-word; }
.card h3:empty { display: none; }
.card .body {
  font-size: 13px; line-height: 1.35; white-space: pre-wrap; word-break: break-word;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4;
  overflow: hidden;
}
.empty { text-align: center; color: var(--muted); padding: 60px 20px; line-height: 1.8; white-space: pre-line; }
.fab {
  position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: 58px; height: 58px; border-radius: 18px; border: none;
  background: var(--accent-bg); color: var(--accent); font-size: 34px; line-height: 1;
  box-shadow: 0 3px 8px rgba(0,0,0,.35); cursor: pointer; z-index: 6;
}
dialog {
  border: none; padding: 0; margin: 0; width: 100vw; max-width: 100vw;
  height: 100vh; height: 100dvh; max-height: none;
  background: var(--surface); color: var(--text); overscroll-behavior: contain;
}
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: transparent; }
.bar {
  display: flex; align-items: center; gap: 4px;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 8px 8px;
}
.bar .sp { flex: 1; }
.bar .tt { font-size: 16px; font-weight: 600; padding-left: 4px; white-space: nowrap; }
.icon {
  border: none; background: transparent; color: var(--text); cursor: pointer;
  width: 44px; height: 44px; border-radius: 50%; font-size: 24px; line-height: 1;
}
.icon.danger { color: var(--danger); font-size: 15px; width: auto; padding: 0 12px; border-radius: 22px; }
.icon.sm { font-size: 18px; }
.edit {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 4px 20px calc(24px + env(safe-area-inset-bottom, 0px));
}
.edit input, .edit textarea {
  display: block; width: 100%; border: none; background: transparent; color: var(--text);
  font: inherit; outline: none; padding: 6px 0; border-radius: 0;
}
.edit input { font-size: 27px; font-weight: 600; margin-bottom: 6px; }
.edit textarea { font-size: 17px; line-height: 1.6; min-height: 60vh; resize: none; overflow: hidden; }
.err { color: var(--danger); font-size: 13px; min-height: 16px; padding: 0 20px; }
.toast {
  position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: #323232; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px;
  z-index: 99; display: none; max-width: 86vw; text-align: center;
}

/* 연상단어 목록 */
.mstart {
  width: 100%; border: none; border-radius: 12px; background: var(--accent); color: var(--surface);
  font: inherit; font-size: 16px; font-weight: 600; padding: 13px 0; margin: 2px 0 10px; cursor: pointer;
}
.mstart.done { background: var(--accent-bg); color: var(--accent); font-weight: 400; }
.mlist { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
.mrow {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px;
  border: none; border-bottom: 1px solid var(--border); background: transparent; color: var(--text);
  font: inherit; text-align: left; cursor: pointer;
}
.mrow:last-child { border-bottom: none; }
.mrow .th { width: 46px; height: 46px; flex: none; border-radius: 6px; object-fit: cover; background: var(--bg); }
.mrow .th.no { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
.mrow .tx { flex: 1; min-width: 0; }
.mrow .t { display: block; font-size: 17px; font-weight: 600; word-break: break-word; }
.mrow .m { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .st { flex: none; font-size: 12px; text-align: right; line-height: 1.4; }
.c-red { color: var(--danger); } .c-ok { color: var(--ok); } .c-mut { color: var(--muted); }

/* 연상 카드 */
#vstage { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
.vcard { transition: transform .18s ease, opacity .18s ease; }
.vcard.out-up { transform: translateY(-40px); opacity: 0; }
.vcard.out-down { transform: translateY(40px); opacity: 0; }
.vimg { display: block; width: 100%; max-height: 40vh; object-fit: contain; border-radius: 10px; background: var(--bg); margin-bottom: 12px; }
.vword { font-size: 32px; font-weight: 600; word-break: break-word; line-height: 1.2; }
.vpron { color: var(--muted); font-size: 16px; display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.say:active { transform: scale(.9); filter: brightness(.85); }
.say.on { background: var(--accent); color: var(--surface); }
.say { transition: transform .08s; display: inline-flex; align-items: center; gap: 6px; border: none; background: var(--accent-bg); color: var(--accent); border-radius: 18px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
.vmean { font-size: 18px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; margin: 14px 0 8px; }
.vmn { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 16px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.vmn b { color: var(--accent); }
.vcf { font-size: 14px; color: var(--warn); margin-top: 8px; }
.rate { display: flex; gap: 8px; margin-top: 16px; }
.rate button { flex: 1; border: none; border-radius: 12px; padding: 12px 0; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; line-height: 1.3; }
.rate small { display: block; font-weight: 400; font-size: 12px; }
.rate .r0 { background: var(--r0); color: var(--danger); }
.rate .r1 { background: var(--r1); color: var(--warn); }
.rate .r2 { background: var(--r2); color: var(--ok); }
.vhint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 14px; }
.vdone { text-align: center; padding: 60px 10px; color: var(--muted); }
.vdone .big { font-size: 30px; color: var(--text); font-weight: 600; margin-bottom: 8px; }

/* 연상단어 입력 */
.mf { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
.mf label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
.mf input, .mf textarea {
  width: 100%; border: 1px solid var(--border); border-radius: 10px; background: var(--field); color: var(--text);
  font: inherit; font-size: 16px; padding: 10px 12px; outline: none;
}
.mf textarea { min-height: 76px; line-height: 1.5; resize: vertical; }
.mf .two { display: flex; gap: 10px; }
.mf .two > div { flex: 1; min-width: 0; }
.mf #f-word { font-size: 22px; font-weight: 600; }
.photo-slot {
  width: 100%; min-height: 120px; border: 2px dashed var(--accent); border-radius: 12px; background: var(--accent-bg);
  color: var(--accent); font: inherit; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  padding: 0; overflow: hidden; margin-top: 4px;
}
.photo-slot img { display: block; width: 100%; max-height: 36vh; object-fit: contain; background: var(--bg); }
.photo-tools { display: flex; gap: 8px; margin-top: 8px; }
.btn, .icon.danger { white-space: nowrap; flex: none; }
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 20px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
.btn.pri { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--danger); }
.note { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* 사진 펴기 */
.cbody { flex: 1; overflow-y: auto; padding: 0 16px 20px; }
#cv { display: block; margin: 6px auto; touch-action: none; border-radius: 6px; }

/* 권 · 보기 · 플레이어 */
.vol { flex: none; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 18px; padding: 8px 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.seg { display: flex; background: var(--field); border: 1px solid var(--border); border-radius: 20px; padding: 3px; margin: 0 0 10px; }
.seg button { flex: 1; border: none; background: transparent; color: var(--muted); font: inherit; font-size: 14px; padding: 7px 0; border-radius: 17px; cursor: pointer; }
.seg button.on { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.player { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
.player[hidden] { display: none; }
.pbtn { flex: none; width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--accent); color: var(--surface); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.pbtn.sm { width: 38px; height: 38px; background: var(--accent-bg); color: var(--accent); font-size: 14px; }
.pmid { flex: 1; min-width: 0; }
.ptitle { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptitle small { font-weight: 400; color: var(--muted); }
.pmid input[type=range] { width: 100%; margin: 4px 0 0; accent-color: var(--accent); }
.ptime { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.pnone { font-size: 13px; color: var(--muted); text-align: center; padding: 10px; border: 1px dashed var(--border); border-radius: 12px; margin-bottom: 10px; }
.pgrow { display: block; width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 0; margin-bottom: 10px; overflow: hidden; cursor: pointer; font: inherit; color: var(--text); text-align: left; }
.pgrow img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: top; background: var(--bg); }
.pgrow .cap { padding: 8px 12px; font-size: 13px; color: var(--muted); }
.vpage { display: block; width: 100%; max-height: calc(100dvh - 150px); object-fit: contain; border-radius: 8px; background: var(--bg); }
.vword-img { display: block; width: 100%; max-height: 58vh; object-fit: contain; border-radius: 10px; background: var(--bg); margin-bottom: 10px; }

#h-pl .player, #h-pl .pnone { margin: 8px 0 0; }
#h-pl .player { padding: 6px 10px; gap: 8px; }
#h-pl .pbtn { width: 40px; height: 40px; font-size: 16px; }
#h-pl .pbtn.sm { width: 34px; height: 34px; }
#h-pl .pnone { padding: 6px; font-size: 12px; }
#h-pl[hidden] { display: none; }
.phd { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 18px 2px 8px; }
.phd:first-child { margin-top: 4px; }
.phd b { font-size: 18px; }
.phd button { border: none; border-radius: 16px; padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; background: var(--accent); color: var(--surface); font-weight: 600; }
.phd .pbt { display: flex; gap: 6px; }
.phd button.rv { background: var(--danger); }
.phd button.ls { background: var(--accent-bg); color: var(--accent); }
.phd button.ls.on { background: var(--warn); color: #fff; }
.phd button.done { background: var(--accent-bg); color: var(--accent); font-weight: 400; }
.tgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.tile {
  position: relative; display: block; width: 100%; padding: 0; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); overflow: hidden; cursor: pointer; font: inherit; color: var(--text);
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
}
.tile img { display: block; width: 100%; height: auto; pointer-events: none; -webkit-touch-callout: none; }
.tile .nm { display: block; padding: 24px 6px; font-size: 15px; font-weight: 600; text-align: center; }
.tile.memo { border: 2px solid var(--warn); }
.tile .mk { position: absolute; right: 4px; top: 4px; background: var(--warn); color: #fff; border-radius: 10px; font-size: 12px; padding: 2px 6px; line-height: 1.3; }
.tile.press { opacity: .6; }
.tile.seen { background: var(--accent-bg); border-color: var(--accent); }
.tile.seen img { opacity: .5; }
.tile .sk { position: absolute; left: 4px; bottom: 4px; background: var(--accent); color: var(--surface); border-radius: 10px; font-size: 11px; padding: 2px 7px; line-height: 1.3; }
.sicon { width: 30px; height: 30px; object-fit: contain; margin: -4px 0; }
.vfront { position: relative; min-height: 62vh; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; cursor: pointer; text-align: center; }
.vfw { font-size: 40px; font-weight: 700; word-break: break-word; line-height: 1.2; }
.vtap { margin-top: 30px; color: var(--muted); font-size: 14px; }
.vmemo { background: var(--r1); border-radius: 10px; padding: 10px 12px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; margin: 0 0 10px; cursor: pointer; }
.vmemo b { color: var(--warn); }

.abcb { flex: none; border: 1px solid var(--accent); background: var(--accent-bg); color: var(--accent); border-radius: 18px; padding: 8px 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.abh { position: sticky; top: 0; background: var(--surface); font-size: 15px; font-weight: 700; color: var(--accent); padding: 10px 2px 4px; border-bottom: 1px solid var(--border); }
.abr { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 12px 6px; border: none; border-bottom: 1px solid var(--border); background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.abr .w { font-size: 18px; font-weight: 600; word-break: break-word; }
.abr .l { flex: none; font-size: 12px; color: var(--muted); text-align: right; line-height: 1.4; }
.abr.seen { background: var(--accent-bg); }
.abr.seen .w { color: var(--accent); }
.abr.seen .l b { color: var(--accent); font-weight: 600; }

.star { border: 1px solid var(--warn); background: transparent; color: var(--warn); border-radius: 18px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
.star.on { background: var(--warn); color: #fff; }
.btn.on { background: var(--warn); color: #fff; border-color: var(--warn); }
.abr .hs { color: var(--warn); margin-left: 6px; }
.tbar { display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 36px; gap: 6px; padding: 0 10px; background: var(--accent-bg); }
.tg1 { grid-column: 1 / 3; display: flex; }
.tg2 { grid-column: 3 / 5; display: flex; border-left: 1px solid var(--border); }
.tbar button { flex: 1; white-space: nowrap; border: none; background: transparent; color: var(--accent); font: inherit; font-size: 14px; font-weight: 600; padding: 12px 0; cursor: pointer; }
.tbar button.on { background: var(--accent); color: var(--surface); }
.trow { display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 36px; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--border); }
.trow.cur { background: var(--r1); }
.tn { width: 34px; height: 30px; border-radius: 8px; background: var(--accent-bg); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.tw, .tm { min-height: 44px; border: none; border-radius: 8px; background: transparent; color: var(--text); font: inherit; cursor: pointer; padding: 6px; text-align: center; word-break: break-word; }
.tw { font-size: 19px; font-weight: 600; }
.tm { font-size: 15px; color: var(--muted); }
.tm img { max-height: 54px; max-width: 100%; border-radius: 4px; vertical-align: middle; }
.tw.hid, .tm.hid { background: var(--bg); color: transparent; border: 1px dashed var(--border); }
.tw.hid img, .tm.hid img { visibility: hidden; }
.tset { display: flex; gap: 14px; align-items: center; padding: 6px 14px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted); }
.tset select { height: 32px; box-shadow: none; border: 1px solid var(--border); font-size: 13px; padding: 0 6px; max-width: none; }
.tile.flash { outline: 3px solid var(--warn); outline-offset: 2px; }
.tscore { font-size: 13px; color: var(--muted); padding: 6px 14px; border-bottom: 1px solid var(--border); }
.tscore:empty { display: none; }
.tgrade { grid-column: 2 / 5; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); padding: 2px 0 4px; }
.tgrade button { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.tn.ok { background: var(--r2); color: var(--ok); }
.tn.ng { background: var(--r0); color: var(--danger); }
.ts { border: none; background: transparent; color: var(--warn); font-size: 20px; cursor: pointer; padding: 0; }

.dchk { display: block; margin-top: 14px; font-size: 15px; line-height: 1.5; }
.dchk input { width: 20px; height: 20px; vertical-align: -4px; margin-right: 6px; }
.dchk small { display: block; color: var(--muted); font-size: 12px; margin-left: 28px; }
.dbody { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 24px 60px; text-align: center; }
.dword { font-size: 46px; font-weight: 800; word-break: break-word; line-height: 1.15; }
.dpron { color: var(--muted); font-size: 18px; margin-top: 8px; }
.dmean { font-size: 26px; margin-top: 22px; line-height: 1.4; word-break: keep-all; }

<script>
(function () {
  var API = 'https://pakpak.86400seccc.workers.dev';
  var H = { 'X-Key': '9981' };
  var LEVELS = [1, 3, 7, 14, 30, 60, 120];
  var NEW_PER_RUN = 20;

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function lsGet(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function newId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function firstLine(s) { return String(s || '').split('\n').filter(function (x) { return x.trim(); })[0] || ''; }
  function today() { var d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
  function toast(t) {
    var e = $('toast'); e.textContent = t; e.style.display = 'block';
    clearTimeout(e._t); e._t = setTimeout(function () { e.style.display = 'none'; }, 2200);
  }
  function int(v, d) { var n = parseInt(v, 10); return n >= 1 ? n : d; }
  var DEVICE = localStorage.getItem('jg-dev');
  if (!DEVICE) { DEVICE = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); localStorage.setItem('jg-dev', DEVICE); }

  /* ================= 서버 저장 (R2) ================= */
  function makeStore(name) {
    var S = { items: lsGet('jg-' + name, []), pending: lsGet('jg-p-' + name, {}), onchange: null };
    S.list = function () { return S.items.filter(function (x) { return !x.del; }); };
    S.get = function (id) { return S.items.find(function (x) { return x.id === id && !x.del; }); };
    S.saveLocal = function () { lsSet('jg-' + name, S.items); lsSet('jg-p-' + name, S.pending); };
    S.apply = function (list) {
      var map = new Map();
      (list || []).forEach(function (x) { if (x && x.id) map.set(x.id, x); });
      Object.keys(S.pending).forEach(function (k) {
        var p = S.pending[k], o = map.get(k);
        if (!o || (p.updated || 0) >= (o.updated || 0)) map.set(k, p);
      });
      S.items = Array.from(map.values());
      S.saveLocal();
      if (S.onchange) S.onchange();
    };
    S.pull = async function () {
      var r = await fetch(API + '/data/' + name, { headers: H, cache: 'no-store' });
      if (!r.ok) throw new Error('pull');
      S.apply(await r.json());
    };
    S.flush = async function () {
      var items = Object.keys(S.pending).map(function (k) { return S.pending[k]; });
      if (!items.length) return;
      var r = await fetch(API + '/data/' + name, {
        method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, H),
        body: JSON.stringify({ items: items })
      });
      if (!r.ok) throw new Error('flush');
      var list = await r.json();
      items.forEach(function (it) { if (S.pending[it.id] && S.pending[it.id].updated === it.updated) delete S.pending[it.id]; });
      S.apply(list);
    };
    S.put = async function (it) {
      it.updated = Date.now();
      var i = S.items.findIndex(function (x) { return x.id === it.id; });
      if (i >= 0) S.items[i] = it; else S.items.push(it);
      S.pending[it.id] = it;
      S.saveLocal();
      if (S.onchange) S.onchange();
      try { await S.flush(); } catch (e) { toast('인터넷이 연결되면 자동으로 저장됩니다'); }
    };
    S.putMany = async function (list) {
      var now = Date.now();
      list.forEach(function (it, k) {
        it.updated = now + k;
        var i = S.items.findIndex(function (x) { return x.id === it.id; });
        if (i >= 0) S.items[i] = it; else S.items.push(it);
        S.pending[it.id] = it;
      });
      S.saveLocal();
      if (S.onchange) S.onchange();
      try { await S.flush(); } catch (e) { toast('인터넷이 연결되면 자동으로 저장됩니다'); }
    };
    return S;
  }
  var MN = makeStore('mn');
  var PK = makeStore('pak');

  // 예전 팍팍 단어를 서버로 한 번 옮기기
  if (!localStorage.getItem('jg-migrated')) {
    var old = lsGet('vocab-words-v2', []);
    if (Array.isArray(old)) old.forEach(function (w) {
      if (!w || !w.id) return;
      var it = { id: w.id, title: w.title || '', body: w.body || '', created: w.created || Date.now(), updated: w.updated || Date.now() };
      PK.pending[it.id] = it;
      if (!PK.items.some(function (x) { return x.id === it.id; })) PK.items.push(it);
    });
    PK.saveLocal();
    localStorage.setItem('jg-migrated', '1');
  }

  var syncing = false;
  async function sync(quiet) {
    if (syncing) return;
    syncing = true;
    try {
      await MN.flush(); await PK.flush();
      await MN.pull(); await PK.pull();
    } catch (e) { if (!quiet) toast('서버 연결 실패 — 저장된 내용을 보여 줍니다'); }
    syncing = false;
  }

  function fileUrl(id, v) { return API + '/photo/' + id + '?v=' + (v || 0); }
  function photoUrl(it) { return fileUrl(it.id, it.pv); }
  async function upload(id, blob, type) {
    var r = await fetch(API + '/photo/' + id, { method: 'PUT', headers: Object.assign({ 'Content-Type': type }, H), body: blob });
    if (!r.ok) throw new Error('upload');
  }
  function toBlob(canvas, maxSide) {
    var c = canvas;
    if (maxSide && Math.max(c.width, c.height) > maxSide) {
      var k = maxSide / Math.max(c.width, c.height), d = document.createElement('canvas');
      d.width = Math.round(c.width * k); d.height = Math.round(c.height * k);
      d.getContext('2d').drawImage(c, 0, 0, d.width, d.height);
      c = d;
    }
    return new Promise(function (res) { c.toBlob(res, 'image/jpeg', 0.85); });
  }

  /* ================= 탭 ================= */
  var tab = 'mn';
  var tabScroll = { mn: null, pak: 0 };
  function setTab(t) {
    if (tab !== t) tabScroll[tab] = window.scrollY;
    tab = t;
    document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === t); });
    $('v-mn').hidden = t !== 'mn';
    $('v-pak').hidden = t !== 'pak';
    $('h-pak').hidden = t !== 'pak';
    $('h-mn').hidden = t !== 'mn' || searching;
    $('h-ms').hidden = t !== 'mn' || !searching;
    $('h-pl').hidden = t !== 'mn' || searching;
    var y = tabScroll[t];
    if (t === 'mn' && y == null) pendingJump = true;
    window.scrollTo(0, y || 0);
  }
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () { setTab(b.dataset.tab); if (b.dataset.tab === 'mn') renderMn(); });
  });
  $('add').addEventListener('click', function () { if (tab === 'mn') openSheet(); else openEditor(null); });

  /* ================= 연상단어 데이터 ================= */
  function kindOf(x) { return x.kind || 'word'; }
  function volOf(x) { return x.vol || 1; }
  function words() { return MN.list().filter(function (x) { return kindOf(x) === 'word'; }); }
  function pages() { return MN.list().filter(function (x) { return kindOf(x) === 'page'; }); }
  function audios() {
    return MN.list().filter(function (x) { return kindOf(x) === 'audio'; })
      .sort(function (a, b) { return (volOf(a) - volOf(b)) || ((a.part || 0) - (b.part || 0)); });
  }
  function bookSort(list) {
    return list.slice().sort(function (a, b) {
      return (volOf(a) - volOf(b)) || ((a.part || 0) - (b.part || 0)) ||
             ((a.pno || 0) - (b.pno || 0)) || ((a.ord || 0) - (b.ord || 0)) || ((a.created || 0) - (b.created || 0));
    });
  }
  function audioOf(v, p) { return MN.get('a-' + v + '-' + p); }
  function label(x) { return volOf(x) + '권 ' + (x.part || '') + '강'; }

  /* ================= 상태 ================= */
  var vol = lsGet('jg-vol', 1);
  var lastP = lsGet('jg-lastp', {});
  var searching = false;
  function sel() { var ps = partsOf(vol), p = lastP[vol]; return ps.indexOf(p) >= 0 ? p : (ps[0] || null); }
  function setSel(p) { lastP[vol] = p; lsSet('jg-lastp', lastP); }
  var pendingJump = false;
  function partsOf(v) {
    var s = {};
    MN.list().forEach(function (x) { if (volOf(x) === v && x.part) s[x.part] = true; });
    return Object.keys(s).map(Number).sort(function (a, b) { return a - b; });
  }
  /* ================= 복습 기록 (폰마다 따로) ================= */
  var SRS = lsGet('jg-srs', {});
  function srsOf(id) { return SRS[id]; }
  function nextLevel(r, rating) {
    var L = r ? r.level : -1;
    if (rating === 0) return 0;
    if (rating === 1) return 1;
    return Math.min(Math.max(L + 1, 2), LEVELS.length - 1);
  }
  function rate(id, rating) {
    var lv = nextLevel(SRS[id], rating);
    SRS[id] = { level: lv, due: today() + LEVELS[lv], n: ((SRS[id] && SRS[id].n) || 0) + 1 };
    lsSet('jg-srs', SRS);
  }
  function statusHtml(id) {
    var r = srsOf(id), t = today();
    if (!r) return '<span class="c-mut">새 단어</span>';
    if (r.due <= t) return '<span class="c-red">오늘 복습</span>';
    return '<span class="c-ok">' + (r.due - t) + '일 뒤</span>';
  }

  /* ================= 연상단어 화면 ================= */
  function renderPills() {
    var ps = partsOf(vol), p = sel();
    $('volbtn').textContent = vol + '권';
    var h = '';
    ps.forEach(function (n) { h += '<button class="pill' + (p === n ? ' on' : '') + '" data-p="' + n + '">' + n + '강</button>'; });
    $('pills').innerHTML = h || '<span class="c-mut" style="font-size:13px;padding:8px 4px">+ 버튼으로 첫 페이지를 넣으세요</span>';
    showPill();
  }
  function showPill() {
    var box = $('pills'), on = box.querySelector('.pill.on');
    if (on) {
      var l = on.offsetLeft - box.offsetLeft, r = l + on.offsetWidth;
      if (l < box.scrollLeft) box.scrollLeft = l - 8;
      else if (r > box.scrollLeft + box.clientWidth) box.scrollLeft = r - box.clientWidth + 8;
    }
  }
  var SEEN = lsGet('jg-seen', {});
  var HARD = lsGet('jg-hard', {});
  function toggleHard(id) { if (HARD[id]) delete HARD[id]; else HARD[id] = 1; lsSet('jg-hard', HARD); return !!HARD[id]; }
  function tileHtml(x, inSearch) {
    var memo = String(x.memo || '').trim(), seen = inSearch && SEEN[x.id];
    var ar = x.sw && x.sh ? ' style="aspect-ratio:' + x.sw + ' / ' + x.sh + '"' : '';
    return '<button class="tile' + (memo ? ' memo' : '') + (seen ? ' seen' : '') + '" data-id="' + esc(x.id) + '" type="button">' +
      (x.photo ? '<img loading="lazy" draggable="false" alt="' + esc(x.title || '') + '"' + ar + ' src="' + esc(photoUrl(x)) + '">' : '<span class="nm">' + esc(x.title || '') + '</span>') +
      (memo ? '<span class="mk">📝</span>' : '') + (seen ? '<span class="sk">찾아봄 ' + SEEN[x.id] + '번</span>' : '') + '</button>';
  }
  function studyBtn(v, p) {
    var t = today(), due = 0, nw = 0;
    words().forEach(function (x) {
      if (volOf(x) !== v || x.part !== p) return;
      var r = srsOf(x.id); if (!r) nw++; else if (r.due <= t) due++;
    });
    var lon = !!(SQ && SQ.on && SQ.src === v + '-' + p);
    return '<span class="pbt"><button class="go ls' + (lon ? ' on' : '') + '" data-listen="' + p + '" type="button">' + (lon ? '■ 정지' : '▶ 듣기') + '</button>' + (due ? '<button class="go rv" data-study="' + p + '" data-m="due" type="button">복습 ' + due + '</button>' : '') +
      '<button class="go" data-study="' + p + '" data-m="all" type="button">클카</button></span>';
  }
  function renderMn() {
    renderPills();
    renderPlayer();
    var listEl = $('mn-list'), em = $('mn-empty'), h = '', n = 0;
    if (searching) {
      var q = $('mq').value.trim().toLowerCase();
      var found = q ? bookSort(words()).filter(function (x) { return (String(x.title || '') + '\n' + (x.memo || '')).toLowerCase().indexOf(q) >= 0; }) : [];
      if (found.length) h = '<div class="tgrid">' + found.map(function (x) { return tileHtml(x, true); }).join('') + '</div>';
      n = found.length;
      em.textContent = q ? '찾는 단어가 없습니다.' : '찾을 단어를 입력하세요. (1권·2권 전체에서 찾습니다)';
    } else {
      var all = bookSort(words()).filter(function (x) { return volOf(x) === vol; });
      partsOf(vol).forEach(function (p) {
        var ws = all.filter(function (x) { return x.part === p; });
        h += '<div class="phd" id="ph-' + p + '" data-p="' + p + '"><b>' + p + '강</b>' + (ws.length ? studyBtn(vol, p) : '') + '</div>';
        h += ws.length ? '<div class="tgrid">' + ws.map(function (x) { return tileHtml(x, false); }).join('') + '</div>' : '<div class="c-mut" style="font-size:13px;padding:4px 2px">아직 단어가 없습니다</div>';
        n++;
      });
      em.textContent = vol + '권에 아직 단어가 없습니다.\n+ 버튼으로 페이지 사진을 넣으세요.';
    }
    var y = window.scrollY;
    listEl.innerHTML = h;
    em.hidden = n > 0;
    if (!searching && pendingJump && n) { pendingJump = false; jumpTo(sel(), false); }
    else window.scrollTo(0, y);
  }
  function jumpTo(p, smooth) {
    var el = p && $('ph-' + p);
    if (!el) { window.scrollTo(0, 0); return; }
    var y = el.getBoundingClientRect().top + window.scrollY - document.querySelector('header').offsetHeight - 4;
    window.scrollTo({ top: Math.max(0, y), behavior: smooth ? 'smooth' : 'auto' });
  }
  var spyT = 0;
  window.addEventListener('scroll', function () {
    if (tab !== 'mn' || searching || spyT) return;
    spyT = setTimeout(function () {
      spyT = 0;
      var hh = document.querySelector('header').offsetHeight, cur = null;
      document.querySelectorAll('.phd').forEach(function (el) { if (el.getBoundingClientRect().top <= hh + 30) cur = Number(el.dataset.p); });
      if (cur == null) { var f = document.querySelector('.phd'); if (f) cur = Number(f.dataset.p); }
      if (cur != null && cur !== sel()) {
        setSel(cur);
        document.querySelectorAll('#pills .pill').forEach(function (b) { b.classList.toggle('on', Number(b.dataset.p) === cur); });
        showPill();
        renderPlayer();
      }
    }, 120);
  }, { passive: true });
  MN.onchange = function () { renderMn(); if ($('vdlg').open) renderViewer(); };

  $('volbtn').addEventListener('click', function () { vol = vol === 1 ? 2 : 1; lsSet('jg-vol', vol); $('pills').scrollLeft = 0; pendingJump = true; renderMn(); });
  $('pills').addEventListener('click', function (e) {
    var b = e.target.closest('.pill'); if (!b) return;
    var p = Number(b.dataset.p);
    setSel(p);
    document.querySelectorAll('#pills .pill').forEach(function (x) { x.classList.toggle('on', x === b); });
    renderPlayer();
    jumpTo(p, true);
  });
  $('sbtn').addEventListener('click', function () {
    searching = true; $('h-mn').hidden = true; $('h-ms').hidden = false;
    $('mq').value = ''; renderMn(); window.scrollTo(0, 0); $('mq').focus();
  });
  $('sclose').addEventListener('click', function () {
    searching = false; $('h-ms').hidden = true; $('h-mn').hidden = false; pendingJump = true; renderMn();
  });
  $('mq').addEventListener('input', function () {
    if ($('mq').value.trim() === '9981') {
      var on = localStorage.getItem('jg-owner') !== '1';
      localStorage.setItem('jg-owner', on ? '1' : '0');
      $('mq').value = '';
      $('rbtn').hidden = !on;
      toast(on ? '이 폰에 리셋 버튼(↺)을 켰습니다' : '이 폰의 리셋 버튼을 껐습니다');
    }
    renderMn();
  });
  $('rbtn').hidden = localStorage.getItem('jg-owner') !== '1';
  $('rbtn').addEventListener('click', async function () {
    var mine = words().filter(function (x) { return x.memoBy === DEVICE && String(x.memo || '').trim(); });
    var msg = '이 폰에서 한 것만 지웁니다.\n\n· 외우기 기록\n· 찾아봄 표시\n· 어려운 단어 ⭐ 표시\n· 이 폰에서 쓴 메모 ' + mine.length + '개\n\n페이지·단어·mp3와 아이가 쓴 메모는 그대로입니다. 리셋할까요?';
    if (!confirm(msg)) return;
    SRS = {}; lsSet('jg-srs', SRS);
    SEEN = {}; lsSet('jg-seen', SEEN);
    HARD = {}; lsSet('jg-hard', HARD);
    if (mine.length) {
      await MN.putMany(mine.map(function (x) { var n = Object.assign({}, x, { memo: '' }); delete n.memoBy; return n; }));
    }
    renderMn();
    toast('리셋했습니다');
  });

  // 짧게 누르면 카드, 길게 누르면 메모
  (function () {
    var list = $('mn-list'), timer = 0, sx = 0, sy = 0, el = null, longDone = false;
    function clear() { clearTimeout(timer); timer = 0; if (el) el.classList.remove('press'); }
    list.addEventListener('pointerdown', function (e) {
      var t = e.target.closest('.tile'); if (!t) return;
      el = t; longDone = false; sx = e.clientX; sy = e.clientY;
      t.classList.add('press');
      timer = setTimeout(function () { timer = 0; longDone = true; t.classList.remove('press'); if (navigator.vibrate) try { navigator.vibrate(30); } catch (x) {} openMemo(t.dataset.id); }, 550);
    });
    list.addEventListener('pointermove', function (e) { if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) clear(); });
    list.addEventListener('pointerup', clear);
    list.addEventListener('pointercancel', clear);
    list.addEventListener('contextmenu', function (e) { if (e.target.closest('.tile')) e.preventDefault(); });
    list.addEventListener('click', function (e) {
      var lb = e.target.closest('[data-listen]');
      if (lb) { listenPart(Number(lb.dataset.listen)); return; }
      var s = e.target.closest('[data-study]');
      if (s) { openStudy(Number(s.dataset.study), s.dataset.m); return; }
      var t = e.target.closest('.tile'); if (!t) return;
      if (longDone) { longDone = false; return; }
      if (searching) { SEEN[t.dataset.id] = (SEEN[t.dataset.id] || 0) + 1; lsSet('jg-seen', SEEN); setTimeout(renderMn, 300); }
      openCards(t.dataset.id);
    });
  })();

  /* ================= 메모 ================= */
  var MM = null;
  function openMemo(id) {
    var w = MN.get(id); if (!w) return;
    MM = { id: id, orig: w.memo || '' };
    $('mm-title').textContent = label(w) + (w.title ? ' · ' + w.title : '') + ' 메모';
    $('mm-text').value = w.memo || '';
    var img = $('mm-img');
    if (w.photo) { img.src = photoUrl(w); img.hidden = false; } else img.hidden = true;
    $('mm-page').hidden = !w.pageId || !MN.get(w.pageId);
    $('mmdlg').showModal();
  }
  async function saveMemo() {
    if (!MM) return;
    var w = MN.get(MM.id), v = $('mm-text').value.replace(/\s+$/, '');
    $('mmdlg').close();
    var id = MM.id; MM = null;
    if (w && v !== (w.memo || '')) {
      var nw = Object.assign({}, w, { memo: v });
      if (v.trim()) nw.memoBy = DEVICE; else delete nw.memoBy;
      await MN.put(nw);
    }
    afterEdit(id);
    return id;
  }
  $('mm-save').addEventListener('click', saveMemo);
  $('mm-back').addEventListener('click', saveMemo);
  $('mmdlg').addEventListener('cancel', function (e) { e.preventDefault(); saveMemo(); });
  $('mm-word').addEventListener('click', async function () { var id = await saveMemo(); if (id) openWordEdit(id); });
  $('mm-page').addEventListener('click', async function () { var id = await saveMemo(); var w = id && MN.get(id); if (w && w.pageId) openPageEdit(w.pageId, w.id); });

  /* ================= mp3 플레이어 ================= */
  var au = $('au'), curTrack = null, seeking = false;
  function fmt(t) { if (!isFinite(t)) return '0:00'; t = Math.floor(t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
  function shownTrack() {
    if (curTrack && MN.get(curTrack)) return MN.get(curTrack);
    var p = sel();
    return p ? (audioOf(vol, p) || null) : null;
  }
  function renderPlayer() {
    var tr = shownTrack(), p = sel();
    $('h-pl').hidden = tab !== 'mn' || searching;
    if (!tr) {
      $('player').hidden = true;
      $('pnone').hidden = !p;
      $('pnone').textContent = vol + '권 ' + p + '강 mp3가 없습니다 · + 버튼에서 올릴 수 있습니다';
      return;
    }
    $('pnone').hidden = true;
    $('player').hidden = false;
    var playing = curTrack === tr.id && !au.paused;
    var other = p && (volOf(tr) !== vol || tr.part !== p);
    $('pl-title').innerHTML = esc(label(tr)) + (playing ? ' <small>재생 중</small>' : '') + (other && audioOf(vol, p) ? ' <small>· 눌러서 ' + vol + '권 ' + p + '강으로</small>' : '');
    $('pl-btn').innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
    if (curTrack !== tr.id) { $('pl-seek').value = 0; $('pl-cur').textContent = '0:00'; $('pl-dur').textContent = ''; }
  }
  function playTrack(tr) {
    curTrack = tr.id;
    au.src = fileUrl(tr.id, tr.av);
    au.play().catch(function () { toast('재생하지 못했습니다'); });
    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: label(tr), artist: '찌공이 단어장', artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }] });
      } catch (e) {}
    }
    renderPlayer();
  }
  function nextOf(id) { var l = audios(), i = l.findIndex(function (x) { return x.id === id; }); return i >= 0 ? l[i + 1] : null; }
  function prevOf(id) { var l = audios(), i = l.findIndex(function (x) { return x.id === id; }); return i > 0 ? l[i - 1] : null; }
  $('pl-btn').addEventListener('click', function () {
    var p = sel(), want = (p && audioOf(vol, p)) || shownTrack();
    if (!want) return;
    if (curTrack === want.id) { if (au.paused) au.play().catch(function () {}); else au.pause(); }
    else playTrack(want);
  });
  $('pl-next').addEventListener('click', function () {
    var tr = shownTrack(); if (!tr) return;
    var nx = nextOf(tr.id);
    if (nx) playTrack(nx); else toast('마지막 강입니다');
  });
  au.addEventListener('ended', function () {
    var nx = curTrack && nextOf(curTrack);
    if (nx) playTrack(nx); else { renderPlayer(); }
  });
  au.addEventListener('play', renderPlayer);
  au.addEventListener('pause', renderPlayer);
  au.addEventListener('timeupdate', function () {
    if (seeking || !au.duration) return;
    var tr = shownTrack(); if (!tr || tr.id !== curTrack) return;
    $('pl-seek').value = Math.round(au.currentTime / au.duration * 1000);
    $('pl-cur').textContent = fmt(au.currentTime);
    $('pl-dur').textContent = fmt(au.duration);
    if ('mediaSession' in navigator && navigator.mediaSession.setPositionState) {
      try { navigator.mediaSession.setPositionState({ duration: au.duration, position: au.currentTime, playbackRate: 1 }); } catch (e) {}
    }
  });
  au.addEventListener('error', function () { if (au.src) toast('mp3를 불러오지 못했습니다'); });
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>찌공이 단어장</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f1f3f4">
<meta name="referrer" content="no-referrer">
<style>
:root {
  --bg: #f1f3f4;
  --surface: #ffffff;
  --text: #202124;
  --muted: #5f6368;
  --border: #dadce0;
  --accent: #1a73e8;
  --accent-bg: #e8f0fe;
  --danger: #d93025;
  --ok: #137333;
  --warn: #b06000;
  --r0: #fce8e6; --r1: #fef7e0; --r2: #e6f4ea;
  --field: #ffffff;
  --shadow: 0 1px 3px rgba(60,64,67,.25);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #202124; --surface: #202124; --text: #e8eaed; --muted: #9aa0a6;
    --border: #5f6368; --accent: #8ab4f8; --accent-bg: #394457; --danger: #f28b82;
    --ok: #81c995; --warn: #fdd663; --r0: #5c2b29; --r1: #594a1d; --r2: #1e4630;
    --field: #2d2e31;
    --shadow: 0 1px 3px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Malgun Gothic", sans-serif;
  min-height: 100vh;
}
button { -webkit-tap-highlight-color: transparent; }
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding: 10px 12px 8px;
}
.tabs { display: flex; background: var(--field); border-radius: 22px; padding: 3px; box-shadow: var(--shadow); margin-bottom: 10px; }
.tabs button {
  flex: 1; border: none; background: transparent; color: var(--muted); font: inherit; font-size: 15px;
  padding: 9px 0; border-radius: 19px; cursor: pointer;
}
.tabs button.on { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.hrow { display: flex; gap: 8px; align-items: center; }
.hrow[hidden] { display: none; }
.search {
  flex: 1; min-width: 0; height: 48px; border: none; border-radius: 24px;
  background: var(--field); color: var(--text); padding: 0 20px; font-size: 16px;
  box-shadow: var(--shadow); outline: none;
}
.search::placeholder { color: var(--muted); }
select {
  height: 48px; border: none; border-radius: 24px; background: var(--field); color: var(--text);
  padding: 0 10px; font-size: 14px; box-shadow: var(--shadow); max-width: 112px;
}
.pills { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.pills::-webkit-scrollbar { display: none; }
.pill {
  flex: none; border: 1px solid var(--border); background: var(--field); color: var(--muted);
  border-radius: 18px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer;
}
.pill.on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.ic {
  flex: none; width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--field); color: var(--text); box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
}
.ic svg { width: 20px; height: 20px; }
.ic[hidden] { display: none; }
main { padding: 6px 12px 110px; }
section[hidden] { display: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; align-items: start; }
.card {
  display: block; width: 100%; text-align: left;
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 14px 10px; cursor: pointer;
  font: inherit; line-height: 1.5;
}

<script>
(function () {
  var API = 'https://pakpak.86400seccc.workers.dev';
  var H = { 'X-Key': '9981' };
  var LEVELS = [1, 3, 7, 14, 30, 60, 120];
  var NEW_PER_RUN = 20;

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function lsGet(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function newId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function firstLine(s) { return String(s || '').split('\n').filter(function (x) { return x.trim(); })[0] || ''; }
  function today() { var d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
  function toast(t) {
    var e = $('toast'); e.textContent = t; e.style.display = 'block';
    clearTimeout(e._t); e._t = setTimeout(function () { e.style.display = 'none'; }, 2200);
  }
  function int(v, d) { var n = parseInt(v, 10); return n >= 1 ? n : d; }
  var DEVICE = localStorage.getItem('jg-dev');
  if (!DEVICE) { DEVICE = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); localStorage.setItem('jg-dev', DEVICE); }

  /* ================= 서버 저장 (R2) ================= */
  function makeStore(name) {
    var S = { items: lsGet('jg-' + name, []), pending: lsGet('jg-p-' + name, {}), onchange: null };
    S.list = function () { return S.items.filter(function (x) { return !x.del; }); };
    S.get = function (id) { return S.items.find(function (x) { return x.id === id && !x.del; }); };
    S.saveLocal = function () { lsSet('jg-' + name, S.items); lsSet('jg-p-' + name, S.pending); };
    S.apply = function (list) {
      var map = new Map();
      (list || []).forEach(function (x) { if (x && x.id) map.set(x.id, x); });
      Object.keys(S.pending).forEach(function (k) {
        var p = S.pending[k], o = map.get(k);
        if (!o || (p.updated || 0) >= (o.updated || 0)) map.set(k, p);
      });
      S.items = Array.from(map.values());
      S.saveLocal();
      if (S.onchange) S.onchange();
    };
    S.pull = async function () {
      var r = await fetch(API + '/data/' + name, { headers: H, cache: 'no-store' });
      if (!r.ok) throw new Error('pull');
      S.apply(await r.json());
    };
    S.flush = async function () {
      var items = Object.keys(S.pending).map(function (k) { return S.pending[k]; });
      if (!items.length) return;
      var r = await fetch(API + '/data/' + name, {
        method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, H),
        body: JSON.stringify({ items: items })
      });
      if (!r.ok) throw new Error('flush');
      var list = await r.json();
      items.forEach(function (it) { if (S.pending[it.id] && S.pending[it.id].updated === it.updated) delete S.pending[it.id]; });
      S.apply(list);
    };
    S.put = async function (it) {
      it.updated = Date.now();
      var i = S.items.findIndex(function (x) { return x.id === it.id; });
      if (i >= 0) S.items[i] = it; else S.items.push(it);
      S.pending[it.id] = it;
      S.saveLocal();
      if (S.onchange) S.onchange();
      try { await S.flush(); } catch (e) { toast('인터넷이 연결되면 자동으로 저장됩니다'); }
    };
    S.putMany = async function (list) {
      var now = Date.now();
      list.forEach(function (it, k) {
        it.updated = now + k;
        var i = S.items.findIndex(function (x) { return x.id === it.id; });
        if (i >= 0) S.items[i] = it; else S.items.push(it);
        S.pending[it.id] = it;
      });
      S.saveLocal();
      if (S.onchange) S.onchange();
      try { await S.flush(); } catch (e) { toast('인터넷이 연결되면 자동으로 저장됩니다'); }
    };
    return S;
  }
  var MN = makeStore('mn');
  var PK = makeStore('pak');

  // 예전 팍팍 단어를 서버로 한 번 옮기기
  if (!localStorage.getItem('jg-migrated')) {
    var old = lsGet('vocab-words-v2', []);
    if (Array.isArray(old)) old.forEach(function (w) {
      if (!w || !w.id) return;
      var it = { id: w.id, title: w.title || '', body: w.body || '', created: w.created || Date.now(), updated: w.updated || Date.now() };
      PK.pending[it.id] = it;
      if (!PK.items.some(function (x) { return x.id === it.id; })) PK.items.push(it);
    });
    PK.saveLocal();
    localStorage.setItem('jg-migrated', '1');
  }

  var syncing = false;
  async function sync(quiet) {
    if (syncing) return;
    syncing = true;
    try {
      await MN.flush(); await PK.flush();
      await MN.pull(); await PK.pull();
    } catch (e) { if (!quiet) toast('서버 연결 실패 — 저장된 내용을 보여 줍니다'); }
    syncing = false;
  }

  function fileUrl(id, v) { return API + '/photo/' + id + '?v=' + (v || 0); }
  function photoUrl(it) { return fileUrl(it.id, it.pv); }
  async function upload(id, blob, type) {
    var r = await fetch(API + '/photo/' + id, { method: 'PUT', headers: Object.assign({ 'Content-Type': type }, H), body: blob });
    if (!r.ok) throw new Error('upload');
  }
  function toBlob(canvas, maxSide) {
    var c = canvas;
    if (maxSide && Math.max(c.width, c.height) > maxSide) {
      var k = maxSide / Math.max(c.width, c.height), d = document.createElement('canvas');
      d.width = Math.round(c.width * k); d.height = Math.round(c.height * k);
      d.getContext('2d').drawImage(c, 0, 0, d.width, d.height);
      c = d;
    }
    return new Promise(function (res) { c.toBlob(res, 'image/jpeg', 0.85); });
  }

  /* ================= 탭 ================= */
  var tab = 'mn';
  var tabScroll = { mn: null, pak: 0 };
  function setTab(t) {
    if (tab !== t) tabScroll[tab] = window.scrollY;
    tab = t;
    document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === t); });
    $('v-mn').hidden = t !== 'mn';
    $('v-pak').hidden = t !== 'pak';
    $('h-pak').hidden = t !== 'pak';
    $('h-mn').hidden = t !== 'mn' || searching;
    $('h-ms').hidden = t !== 'mn' || !searching;
    $('h-pl').hidden = t !== 'mn' || searching;
    var y = tabScroll[t];
    if (t === 'mn' && y == null) pendingJump = true;
    window.scrollTo(0, y || 0);
  }
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () { setTab(b.dataset.tab); if (b.dataset.tab === 'mn') renderMn(); });
  });
  $('add').addEventListener('click', function () { if (tab === 'mn') openSheet(); else openEditor(null); });

  /* ================= 연상단어 데이터 ================= */
  function kindOf(x) { return x.kind || 'word'; }
  function volOf(x) { return x.vol || 1; }
  function words() { return MN.list().filter(function (x) { return kindOf(x) === 'word'; }); }
  function pages() { return MN.list().filter(function (x) { return kindOf(x) === 'page'; }); }
  function audios() {
    return MN.list().filter(function (x) { return kindOf(x) === 'audio'; })
      .sort(function (a, b) { return (volOf(a) - volOf(b)) || ((a.part || 0) - (b.part || 0)); });
  }
  function bookSort(list) {
    return list.slice().sort(function (a, b) {
      return (volOf(a) - volOf(b)) || ((a.part || 0) - (b.part || 0)) ||
             ((a.pno || 0) - (b.pno || 0)) || ((a.ord || 0) - (b.ord || 0)) || ((a.created || 0) - (b.created || 0));
    });
  }
  function audioOf(v, p) { return MN.get('a-' + v + '-' + p); }
  function label(x) { return volOf(x) + '권 ' + (x.part || '') + '강'; }

  /* ================= 상태 ================= */
  var vol = lsGet('jg-vol', 1);
  var lastP = lsGet('jg-lastp', {});
  var searching = false;
  function sel() { var ps = partsOf(vol), p = lastP[vol]; return ps.indexOf(p) >= 0 ? p : (ps[0] || null); }
  function setSel(p) { lastP[vol] = p; lsSet('jg-lastp', lastP); }
  var pendingJump = false;
  function partsOf(v) {
    var s = {};
    MN.list().forEach(function (x) { if (volOf(x) === v && x.part) s[x.part] = true; });
    return Object.keys(s).map(Number).sort(function (a, b) { return a - b; });
  }
  /* ================= 복습 기록 (폰마다 따로) ================= */
  var SRS = lsGet('jg-srs', {});
  function srsOf(id) { return SRS[id]; }
  function nextLevel(r, rating) {
    var L = r ? r.level : -1;
    if (rating === 0) return 0;
    if (rating === 1) return 1;
    return Math.min(Math.max(L + 1, 2), LEVELS.length - 1);
  }
  function rate(id, rating) {
    var lv = nextLevel(SRS[id], rating);
    SRS[id] = { level: lv, due: today() + LEVELS[lv], n: ((SRS[id] && SRS[id].n) || 0) + 1 };
    lsSet('jg-srs', SRS);
  }
  function statusHtml(id) {
    var r = srsOf(id), t = today();
    if (!r) return '<span class="c-mut">새 단어</span>';
    if (r.due <= t) return '<span class="c-red">오늘 복습</span>';
    return '<span class="c-ok">' + (r.due - t) + '일 뒤</span>';
  }

  /* ================= 연상단어 화면 ================= */
  function renderPills() {
    var ps = partsOf(vol), p = sel();
    $('volbtn').textContent = vol + '권';
    var h = '';
    ps.forEach(function (n) { h += '<button class="pill' + (p === n ? ' on' : '') + '" data-p="' + n + '">' + n + '강</button>'; });
    $('pills').innerHTML = h || '<span class="c-mut" style="font-size:13px;padding:8px 4px">+ 버튼으로 첫 페이지를 넣으세요</span>';
    showPill();
  }
  function showPill() {
    var box = $('pills'), on = box.querySelector('.pill.on');
    if (on) {
      var l = on.offsetLeft - box.offsetLeft, r = l + on.offsetWidth;
      if (l < box.scrollLeft) box.scrollLeft = l - 8;
      else if (r > box.scrollLeft + box.clientWidth) box.scrollLeft = r - box.clientWidth + 8;
    }
  }
  var SEEN = lsGet('jg-seen', {});
  var HARD = lsGet('jg-hard', {});
  function toggleHard(id) { if (HARD[id]) delete HARD[id]; else HARD[id] = 1; lsSet('jg-hard', HARD); return !!HARD[id]; }
  function tileHtml(x, inSearch) {
    var memo = String(x.memo || '').trim(), seen = inSearch && SEEN[x.id];
    var ar = x.sw && x.sh ? ' style="aspect-ratio:' + x.sw + ' / ' + x.sh + '"' : '';
    return '<button class="tile' + (memo ? ' memo' : '') + (seen ? ' seen' : '') + '" data-id="' + esc(x.id) + '" type="button">' +
      (x.photo ? '<img loading="lazy" draggable="false" alt="' + esc(x.title || '') + '"' + ar + ' src="' + esc(photoUrl(x)) + '">' : '<span class="nm">' + esc(x.title || '') + '</span>') +
      (memo ? '<span class="mk">📝</span>' : '') + (seen ? '<span class="sk">찾아봄 ' + SEEN[x.id] + '번</span>' : '') + '</button>';
  }
  function studyBtn(v, p) {
    var t = today(), due = 0, nw = 0;
    words().forEach(function (x) {
      if (volOf(x) !== v || x.part !== p) return;
      var r = srsOf(x.id); if (!r) nw++; else if (r.due <= t) due++;
    });
    var lon = !!(SQ && SQ.on && SQ.src === v + '-' + p);
    return '<span class="pbt"><button class="go ls' + (lon ? ' on' : '') + '" data-listen="' + p + '" type="button">' + (lon ? '■ 정지' : '▶ 듣기') + '</button>' + (due ? '<button class="go rv" data-study="' + p + '" data-m="due" type="button">복습 ' + due + '</button>' : '') +
      '<button class="go" data-study="' + p + '" data-m="all" type="button">클카</button></span>';
  }
  function renderMn() {
    renderPills();
    renderPlayer();
    var listEl = $('mn-list'), em = $('mn-empty'), h = '', n = 0;
    if (searching) {
      var q = $('mq').value.trim().toLowerCase();
      var found = q ? bookSort(words()).filter(function (x) { return (String(x.title || '') + '\n' + (x.memo || '')).toLowerCase().indexOf(q) >= 0; }) : [];
      if (found.length) h = '<div class="tgrid">' + found.map(function (x) { return tileHtml(x, true); }).join('') + '</div>';
      n = found.length;
      em.textContent = q ? '찾는 단어가 없습니다.' : '찾을 단어를 입력하세요. (1권·2권 전체에서 찾습니다)';
    } else {
      var all = bookSort(words()).filter(function (x) { return volOf(x) === vol; });
      partsOf(vol).forEach(function (p) {
        var ws = all.filter(function (x) { return x.part === p; });
        h += '<div class="phd" id="ph-' + p + '" data-p="' + p + '"><b>' + p + '강</b>' + (ws.length ? studyBtn(vol, p) : '') + '</div>';
        h += ws.length ? '<div class="tgrid">' + ws.map(function (x) { return tileHtml(x, false); }).join('') + '</div>' : '<div class="c-mut" style="font-size:13px;padding:4px 2px">아직 단어가 없습니다</div>';
        n++;
      });
      em.textContent = vol + '권에 아직 단어가 없습니다.\n+ 버튼으로 페이지 사진을 넣으세요.';
    }
    var y = window.scrollY;
    listEl.innerHTML = h;
    em.hidden = n > 0;
    if (!searching && pendingJump && n) { pendingJump = false; jumpTo(sel(), false); }
    else window.scrollTo(0, y);
  }
  function jumpTo(p, smooth) {
    var el = p && $('ph-' + p);
    if (!el) { window.scrollTo(0, 0); return; }
    var y = el.getBoundingClientRect().top + window.scrollY - document.querySelector('header').offsetHeight - 4;
    window.scrollTo({ top: Math.max(0, y), behavior: smooth ? 'smooth' : 'auto' });
  }
  var spyT = 0;
  window.addEventListener('scroll', function () {
    if (tab !== 'mn' || searching || spyT) return;
    spyT = setTimeout(function () {
      spyT = 0;
      var hh = document.querySelector('header').offsetHeight, cur = null;
      document.querySelectorAll('.phd').forEach(function (el) { if (el.getBoundingClientRect().top <= hh + 30) cur = Number(el.dataset.p); });
      if (cur == null) { var f = document.querySelector('.phd'); if (f) cur = Number(f.dataset.p); }
      if (cur != null && cur !== sel()) {
        setSel(cur);
        document.querySelectorAll('#pills .pill').forEach(function (b) { b.classList.toggle('on', Number(b.dataset.p) === cur); });
        showPill();
        renderPlayer();
      }
    }, 120);
  }, { passive: true });
  MN.onchange = function () { renderMn(); if ($('vdlg').open) renderViewer(); };

  $('volbtn').addEventListener('click', function () { vol = vol === 1 ? 2 : 1; lsSet('jg-vol', vol); $('pills').scrollLeft = 0; pendingJump = true; renderMn(); });
  $('pills').addEventListener('click', function (e) {
    var b = e.target.closest('.pill'); if (!b) return;
    var p = Number(b.dataset.p);
    setSel(p);
    document.querySelectorAll('#pills .pill').forEach(function (x) { x.classList.toggle('on', x === b); });
    renderPlayer();
    jumpTo(p, true);
  });
  $('sbtn').addEventListener('click', function () {
    searching = true; $('h-mn').hidden = true; $('h-ms').hidden = false;
    $('mq').value = ''; renderMn(); window.scrollTo(0, 0); $('mq').focus();
  });
  $('sclose').addEventListener('click', function () {
    searching = false; $('h-ms').hidden = true; $('h-mn').hidden = false; pendingJump = true; renderMn();
  });
  $('mq').addEventListener('input', function () {
    if ($('mq').value.trim() === '9981') {
      var on = localStorage.getItem('jg-owner') !== '1';
      localStorage.setItem('jg-owner', on ? '1' : '0');
      $('mq').value = '';
      $('rbtn').hidden = !on;
      toast(on ? '이 폰에 리셋 버튼(↺)을 켰습니다' : '이 폰의 리셋 버튼을 껐습니다');
    }
    renderMn();
  });
  $('rbtn').hidden = localStorage.getItem('jg-owner') !== '1';
  $('rbtn').addEventListener('click', async function () {
    var mine = words().filter(function (x) { return x.memoBy === DEVICE && String(x.memo || '').trim(); });
    var msg = '이 폰에서 한 것만 지웁니다.\n\n· 외우기 기록\n· 찾아봄 표시\n· 어려운 단어 ⭐ 표시\n· 이 폰에서 쓴 메모 ' + mine.length + '개\n\n페이지·단어·mp3와 아이가 쓴 메모는 그대로입니다. 리셋할까요?';
    if (!confirm(msg)) return;
    SRS = {}; lsSet('jg-srs', SRS);
    SEEN = {}; lsSet('jg-seen', SEEN);
    HARD = {}; lsSet('jg-hard', HARD);
    if (mine.length) {
      await MN.putMany(mine.map(function (x) { var n = Object.assign({}, x, { memo: '' }); delete n.memoBy; return n; }));
    }
    renderMn();
    toast('리셋했습니다');
  });

  // 짧게 누르면 카드, 길게 누르면 메모
  (function () {
    var list = $('mn-list'), timer = 0, sx = 0, sy = 0, el = null, longDone = false;
    function clear() { clearTimeout(timer); timer = 0; if (el) el.classList.remove('press'); }
    list.addEventListener('pointerdown', function (e) {
      var t = e.target.closest('.tile'); if (!t) return;
      el = t; longDone = false; sx = e.clientX; sy = e.clientY;
      t.classList.add('press');
      timer = setTimeout(function () { timer = 0; longDone = true; t.classList.remove('press'); if (navigator.vibrate) try { navigator.vibrate(30); } catch (x) {} openMemo(t.dataset.id); }, 550);
    });
    list.addEventListener('pointermove', function (e) { if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) clear(); });
    list.addEventListener('pointerup', clear);
    list.addEventListener('pointercancel', clear);
    list.addEventListener('contextmenu', function (e) { if (e.target.closest('.tile')) e.preventDefault(); });
    list.addEventListener('click', function (e) {
      var lb = e.target.closest('[data-listen]');
      if (lb) { listenPart(Number(lb.dataset.listen)); return; }
      var s = e.target.closest('[data-study]');
      if (s) { openStudy(Number(s.dataset.study), s.dataset.m); return; }
      var t = e.target.closest('.tile'); if (!t) return;
      if (longDone) { longDone = false; return; }
      if (searching) { SEEN[t.dataset.id] = (SEEN[t.dataset.id] || 0) + 1; lsSet('jg-seen', SEEN); setTimeout(renderMn, 300); }
      openCards(t.dataset.id);
    });
  })();

  /* ================= 메모 ================= */
  var MM = null;
  function openMemo(id) {
    var w = MN.get(id); if (!w) return;
    MM = { id: id, orig: w.memo || '' };
    $('mm-title').textContent = label(w) + (w.title ? ' · ' + w.title : '') + ' 메모';
    $('mm-text').value = w.memo || '';
    var img = $('mm-img');
    if (w.photo) { img.src = photoUrl(w); img.hidden = false; } else img.hidden = true;
    $('mm-page').hidden = !w.pageId || !MN.get(w.pageId);
    $('mmdlg').showModal();
  }
  async function saveMemo() {
    if (!MM) return;
    var w = MN.get(MM.id), v = $('mm-text').value.replace(/\s+$/, '');
    $('mmdlg').close();
    var id = MM.id; MM = null;
    if (w && v !== (w.memo || '')) {
      var nw = Object.assign({}, w, { memo: v });
      if (v.trim()) nw.memoBy = DEVICE; else delete nw.memoBy;
      await MN.put(nw);
    }
    afterEdit(id);
    return id;
  }
  $('mm-save').addEventListener('click', saveMemo);
  $('mm-back').addEventListener('click', saveMemo);
  $('mmdlg').addEventListener('cancel', function (e) { e.preventDefault(); saveMemo(); });
  $('mm-word').addEventListener('click', async function () { var id = await saveMemo(); if (id) openWordEdit(id); });
  $('mm-page').addEventListener('click', async function () { var id = await saveMemo(); var w = id && MN.get(id); if (w && w.pageId) openPageEdit(w.pageId, w.id); });

  /* ================= mp3 플레이어 ================= */
  var au = $('au'), curTrack = null, seeking = false;
  function fmt(t) { if (!isFinite(t)) return '0:00'; t = Math.floor(t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
  function shownTrack() {
    if (curTrack && MN.get(curTrack)) return MN.get(curTrack);
    var p = sel();
    return p ? (audioOf(vol, p) || null) : null;
  }
  function renderPlayer() {
    var tr = shownTrack(), p = sel();
    $('h-pl').hidden = tab !== 'mn' || searching;
    if (!tr) {
      $('player').hidden = true;
      $('pnone').hidden = !p;
      $('pnone').textContent = vol + '권 ' + p + '강 mp3가 없습니다 · + 버튼에서 올릴 수 있습니다';
      return;
    }
    $('pnone').hidden = true;
    $('player').hidden = false;
    var playing = curTrack === tr.id && !au.paused;
    var other = p && (volOf(tr) !== vol || tr.part !== p);
    $('pl-title').innerHTML = esc(label(tr)) + (playing ? ' <small>재생 중</small>' : '') + (other && audioOf(vol, p) ? ' <small>· 눌러서 ' + vol + '권 ' + p + '강으로</small>' : '');
    $('pl-btn').innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
    if (curTrack !== tr.id) { $('pl-seek').value = 0; $('pl-cur').textContent = '0:00'; $('pl-dur').textContent = ''; }
  }
  function playTrack(tr) {
    curTrack = tr.id;
    au.src = fileUrl(tr.id, tr.av);
    au.play().catch(function () { toast('재생하지 못했습니다'); });
    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: label(tr), artist: '찌공이 단어장', artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }] });
      } catch (e) {}
    }
    renderPlayer();
  }
  function nextOf(id) { var l = audios(), i = l.findIndex(function (x) { return x.id === id; }); return i >= 0 ? l[i + 1] : null; }
  function prevOf(id) { var l = audios(), i = l.findIndex(function (x) { return x.id === id; }); return i > 0 ? l[i - 1] : null; }
  $('pl-btn').addEventListener('click', function () {
    var p = sel(), want = (p && audioOf(vol, p)) || shownTrack();
    if (!want) return;
    if (curTrack === want.id) { if (au.paused) au.play().catch(function () {}); else au.pause(); }
    else playTrack(want);
  });
  $('pl-next').addEventListener('click', function () {
    var tr = shownTrack(); if (!tr) return;
    var nx = nextOf(tr.id);
    if (nx) playTrack(nx); else toast('마지막 강입니다');
  });
  au.addEventListener('ended', function () {
    var nx = curTrack && nextOf(curTrack);
    if (nx) playTrack(nx); else { renderPlayer(); }
  });
  au.addEventListener('play', renderPlayer);
  au.addEventListener('pause', renderPlayer);
  au.addEventListener('timeupdate', function () {
    if (seeking || !au.duration) return;
    var tr = shownTrack(); if (!tr || tr.id !== curTrack) return;
    $('pl-seek').value = Math.round(au.currentTime / au.duration * 1000);
    $('pl-cur').textContent = fmt(au.currentTime);
    $('pl-dur').textContent = fmt(au.duration);
    if ('mediaSession' in navigator && navigator.mediaSession.setPositionState) {
      try { navigator.mediaSession.setPositionState({ duration: au.duration, position: au.currentTime, playbackRate: 1 }); } catch (e) {}
    }
  });
  au.addEventListener('error', function () { if (au.src) toast('mp3를 불러오지 못했습니다'); });
</script>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
