<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>찌공이 단어장</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="PakPak.png">
<link rel="apple-touch-icon" href="PakPak.png">
<meta name="theme-color" content="#f1f3f4">
<style>
:root {
  --bg: #f1f3f4;
  --surface: #ffffff;
  --text: #202124;
  --muted: #5f6368;
  --border: #dadce0;
  --accent: #1a73e8;
  --accent-bg: #e8f0fe;
  --danger: #d93025;
  --ok: #137333;
  --warn: #b06000;
  --r0: #fce8e6; --r1: #fef7e0; --r2: #e6f4ea;
  --field: #ffffff;
  --shadow: 0 1px 3px rgba(60,64,67,.25);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #202124; --surface: #202124; --text: #e8eaed; --muted: #9aa0a6;
    --border: #5f6368; --accent: #8ab4f8; --accent-bg: #394457; --danger: #f28b82;
    --ok: #81c995; --warn: #fdd663; --r0: #5c2b29; --r1: #594a1d; --r2: #1e4630;
    --field: #2d2e31;
    --shadow: 0 1px 3px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Malgun Gothic", sans-serif;
  min-height: 100vh;
}
button { -webkit-tap-highlight-color: transparent; }
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding: 10px 12px 8px;
}
.tabs { display: flex; background: var(--field); border-radius: 22px; padding: 3px; box-shadow: var(--shadow); margin-bottom: 10px; }
.tabs button {
  flex: 1; border: none; background: transparent; color: var(--muted); font: inherit; font-size: 15px;
  padding: 9px 0; border-radius: 19px; cursor: pointer;
}
.tabs button.on { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.hrow { display: flex; gap: 8px; align-items: center; }
.hrow[hidden] { display: none; }
.search {
  flex: 1; min-width: 0; height: 48px; border: none; border-radius: 24px;
  background: var(--field); color: var(--text); padding: 0 20px; font-size: 16px;
  box-shadow: var(--shadow); outline: none;
}
.search::placeholder { color: var(--muted); }
select {
  height: 48px; border: none; border-radius: 24px; background: var(--field); color: var(--text);
  padding: 0 10px; font-size: 14px; box-shadow: var(--shadow); max-width: 112px;
}
.pills { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.pills::-webkit-scrollbar { display: none; }
.pill {
  flex: none; border: 1px solid var(--border); background: var(--field); color: var(--muted);
  border-radius: 18px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer;
}
.pill.on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.ic {
  flex: none; width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--field); color: var(--text); box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
}
.ic svg { width: 20px; height: 20px; }
main { padding: 6px 12px 110px; }
section[hidden] { display: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; align-items: start; }
.card {
  display: block; width: 100%; text-align: left;
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 14px 10px; cursor: pointer;
  font: inherit; line-height: 1.5;
}
.card h3 { margin: 0 0 4px; font-size: 20px; font-weight: 600; word-break: break-word; }
.card h3:empty { display: none; }
.card .body {
  font-size: 13px; line-height: 1.35; white-space: pre-wrap; word-break: break-word;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4;
  overflow: hidden;
}
.empty { text-align: center; color: var(--muted); padding: 60px 20px; line-height: 1.8; white-space: pre-line; }
.fab {
  position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: 58px; height: 58px; border-radius: 18px; border: none;
  background: var(--accent-bg); color: var(--accent); font-size: 34px; line-height: 1;
  box-shadow: 0 3px 8px rgba(0,0,0,.35); cursor: pointer; z-index: 6;
}
dialog {
  border: none; padding: 0; margin: 0; width: 100vw; max-width: 100vw;
  height: 100vh; height: 100dvh; max-height: none;
  background: var(--surface); color: var(--text); overscroll-behavior: contain;
}
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: transparent; }
.bar {
  display: flex; align-items: center; gap: 4px;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 8px 8px;
}
.bar .sp { flex: 1; }
.bar .tt { font-size: 16px; font-weight: 600; padding-left: 4px; white-space: nowrap; }
.icon {
  border: none; background: transparent; color: var(--text); cursor: pointer;
  width: 44px; height: 44px; border-radius: 50%; font-size: 24px; line-height: 1;
}
.icon.danger { color: var(--danger); font-size: 15px; width: auto; padding: 0 12px; border-radius: 22px; }
.icon.sm { font-size: 18px; }
.edit {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 4px 20px calc(24px + env(safe-area-inset-bottom, 0px));
}
.edit input, .edit textarea {
  display: block; width: 100%; border: none; background: transparent; color: var(--text);
  font: inherit; outline: none; padding: 6px 0; border-radius: 0;
}
.edit input { font-size: 27px; font-weight: 600; margin-bottom: 6px; }
.edit textarea { font-size: 17px; line-height: 1.6; min-height: 60vh; resize: none; overflow: hidden; }
.err { color: var(--danger); font-size: 13px; min-height: 16px; padding: 0 20px; }
.toast {
  position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: #323232; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px;
  z-index: 99; display: none; max-width: 86vw; text-align: center;
}

/* 연상단어 목록 */
.mstart {
  width: 100%; border: none; border-radius: 12px; background: var(--accent); color: var(--surface);
  font: inherit; font-size: 16px; font-weight: 600; padding: 13px 0; margin: 2px 0 10px; cursor: pointer;
}
.mstart.done { background: var(--accent-bg); color: var(--accent); font-weight: 400; }
.mlist { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
.mrow {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px;
  border: none; border-bottom: 1px solid var(--border); background: transparent; color: var(--text);
  font: inherit; text-align: left; cursor: pointer;
}
.mrow:last-child { border-bottom: none; }
.mrow .th { width: 46px; height: 46px; flex: none; border-radius: 6px; object-fit: cover; background: var(--bg); }
.mrow .th.no { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
.mrow .tx { flex: 1; min-width: 0; }
.mrow .t { display: block; font-size: 17px; font-weight: 600; word-break: break-word; }
.mrow .m { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .st { flex: none; font-size: 12px; text-align: right; line-height: 1.4; }
.c-red { color: var(--danger); } .c-ok { color: var(--ok); } .c-mut { color: var(--muted); }

/* 연상 카드 */
#vstage { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
.vcard { transition: transform .18s ease, opacity .18s ease; }
.vcard.out-up { transform: translateY(-40px); opacity: 0; }
.vcard.out-down { transform: translateY(40px); opacity: 0; }
.vimg { display: block; width: 100%; max-height: 40vh; object-fit: contain; border-radius: 10px; background: var(--bg); margin-bottom: 12px; }
.vword { font-size: 32px; font-weight: 600; word-break: break-word; line-height: 1.2; }
.vpron { color: var(--muted); font-size: 16px; display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.say { border: none; background: var(--accent-bg); color: var(--accent); border-radius: 18px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
.vmean { font-size: 18px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; margin: 14px 0 8px; }
.vmn { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 16px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.vmn b { color: var(--accent); }
.vcf { font-size: 14px; color: var(--warn); margin-top: 8px; }
.rate { display: flex; gap: 8px; margin-top: 16px; }
.rate button { flex: 1; border: none; border-radius: 12px; padding: 12px 0; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; line-height: 1.3; }
.rate small { display: block; font-weight: 400; font-size: 12px; }
.rate .r0 { background: var(--r0); color: var(--danger); }
.rate .r1 { background: var(--r1); color: var(--warn); }
.rate .r2 { background: var(--r2); color: var(--ok); }
.vhint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 14px; }
.vdone { text-align: center; padding: 60px 10px; color: var(--muted); }
.vdone .big { font-size: 30px; color: var(--text); font-weight: 600; margin-bottom: 8px; }

/* 연상단어 입력 */
.mf { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
.mf label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
.mf input, .mf textarea {
  width: 100%; border: 1px solid var(--border); border-radius: 10px; background: var(--field); color: var(--text);
  font: inherit; font-size: 16px; padding: 10px 12px; outline: none;
}
.mf textarea { min-height: 76px; line-height: 1.5; resize: vertical; }
.mf .two { display: flex; gap: 10px; }
.mf .two > div { flex: 1; min-width: 0; }
.mf #f-word { font-size: 22px; font-weight: 600; }
.photo-slot {
  width: 100%; min-height: 120px; border: 2px dashed var(--accent); border-radius: 12px; background: var(--accent-bg);
  color: var(--accent); font: inherit; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  padding: 0; overflow: hidden; margin-top: 4px;
}
.photo-slot img { display: block; width: 100%; max-height: 36vh; object-fit: contain; background: var(--bg); }
.photo-tools { display: flex; gap: 8px; margin-top: 8px; }
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 20px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
.btn.pri { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--danger); }
.note { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* 사진 펴기 */
.cbody { flex: 1; overflow-y: auto; padding: 0 16px 20px; }
#cv { display: block; margin: 6px auto; touch-action: none; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <div class="tabs">
    <button type="button" data-tab="mn" class="on">연상단어</button>
    <button type="button" data-tab="pak">팍팍</button>
  </div>
  <div class="hrow" id="h-mn">
    <div class="pills" id="pills"></div>
    <button class="ic" id="sbtn" type="button" aria-label="단어 찾기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.6-4.6"/></svg>
    </button>
  </div>
  <div class="hrow" id="h-ms" hidden>
    <input id="mq" class="search" type="search" placeholder="단어나 뜻 찾기" autocomplete="off" autocapitalize="none">
    <button class="ic" id="sclose" type="button" aria-label="찾기 닫기" style="font-size:18px">&#10005;</button>
  </div>
  <div class="hrow" id="h-pak" hidden>
    <input id="q" class="search" type="search" placeholder="검색" autocomplete="off">
    <select id="sort" aria-label="정렬">
      <option value="az">이름순</option>
      <option value="za">이름 역순</option>
      <option value="created">만든 순</option>
      <option value="updated">수정 순</option>
    </select>
  </div>
</header>
<main>
  <section id="v-mn">
    <div id="mn-start"></div>
    <div class="mlist" id="mn-list"></div>
    <div class="empty" id="mn-empty" hidden></div>
  </section>
  <section id="v-pak" hidden>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </section>
</main>
<button class="fab" id="add" aria-label="새 단어">+</button>
<div class="toast" id="toast"></div>

<!-- 팍팍 편집 (처음 그대로) -->
<dialog id="dlg">
  <div class="bar">
    <button class="icon" id="back" type="button" aria-label="저장하고 닫기">&#8592;</button>
    <span class="sp"></span>
    <button class="icon danger" id="del" type="button">삭제</button>
  </div>
  <div class="err" id="err"></div>
  <div class="edit" id="edit">
    <input id="f-title" placeholder="제목" autocomplete="off" autocapitalize="none">
    <textarea id="f-body" placeholder="메모 입력"></textarea>
  </div>
</dialog>

<!-- 연상 카드 -->
<dialog id="vdlg">
  <div class="bar">
    <button class="icon" id="v-back" type="button" aria-label="닫기">&#8592;</button>
    <span class="tt" id="v-title"></span>
    <span class="sp"></span>
    <button class="icon sm" id="v-prev" type="button" aria-label="이전 단어">&#9650;</button>
    <button class="icon sm" id="v-next" type="button" aria-label="다음 단어">&#9660;</button>
    <button class="icon sm" id="v-edit" type="button" aria-label="고치기">&#9998;</button>
  </div>
  <div id="vstage"></div>
</dialog>

<!-- 연상단어 입력 -->
<dialog id="edlg">
  <div class="bar">
    <button class="icon" id="e-back" type="button" aria-label="저장하고 닫기">&#8592;</button>
    <span class="tt" id="e-title">연상단어</span>
    <span class="sp"></span>
    <button class="icon danger" id="e-del" type="button">삭제</button>
    <button class="btn pri" id="e-save" type="button">저장</button>
  </div>
  <div class="err" id="e-err"></div>
  <div class="mf">
    <button class="photo-slot" id="e-photo" type="button"></button>
    <div class="photo-tools" id="e-ptools"></div>
    <label>단어</label>
    <input id="f-word" autocomplete="off" autocapitalize="none" placeholder="burden">
    <label>발음기호</label>
    <input id="f-pron" autocomplete="off" autocapitalize="none" placeholder="[bə́ːrdn]">
    <label>뜻</label>
    <textarea id="f-mean" placeholder="n. 무거운 짐, 부담&#10;v. ~에게 짐을 지우다"></textarea>
    <label>연상 문장 (별표로 감싸면 파란색: *붜서 든*)</label>
    <textarea id="f-mn" placeholder="항아리에 물을 *붜서 든* 무거운 짐, 부담"></textarea>
    <div class="two">
      <div><label>강</label><input id="f-part" type="number" inputmode="numeric" min="1" placeholder="19"></div>
      <div><label>책 순서</label><input id="f-ord" type="number" inputmode="numeric" min="1" placeholder="자동"></div>
    </div>
    <label>헷갈리는 단어</label>
    <input id="f-cf" autocomplete="off" autocapitalize="none" placeholder="conscience">
    <div class="note">책 순서를 비워 두면 그 강의 맨 뒤에 들어갑니다.</div>
  </div>
</dialog>

<!-- 사진 펴기 -->
<dialog id="cdlg">
  <div class="bar">
    <button class="icon" id="c-back" type="button" aria-label="취소">&#8592;</button>
    <span class="tt">사진 펴기</span>
    <span class="sp"></span>
    <button class="btn pri" id="c-ok" type="button">완료</button>
  </div>
  <div class="cbody">
    <div class="note" style="margin:0 0 6px;line-height:1.5">네 개의 점을 그림 칸의 모서리에 맞추세요. 점을 끄는 동안 위쪽에 확대 화면이 나옵니다.</div>
    <canvas id="cv"></canvas>
    <div class="photo-tools">
      <button class="btn" id="c-full" type="button">사진 전체로</button>
      <button class="btn" id="c-raw" type="button">펴지 않고 그대로 쓰기</button>
    </div>
  </div>
</dialog>

<input type="file" id="pfile" accept="image/*" hidden>

<script>
(function () {
  var API = 'https://pakpak.86400seccc.workers.dev';
  var H = { 'X-Key': '9981' };
  var LEVELS = [1, 3, 7, 14, 30, 60, 120];
  var NEW_PER_RUN = 20;

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function lsGet(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function newId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function firstLine(s) { return String(s || '').split('\n').filter(function (x) { return x.trim(); })[0] || ''; }
  function today() { var d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
  function toast(t) {
    var e = $('toast'); e.textContent = t; e.style.display = 'block';
    clearTimeout(e._t); e._t = setTimeout(function () { e.style.display = 'none'; }, 2000);
  }

  /* ================= 서버 저장 (R2) ================= */
  function makeStore(name) {
    var S = { items: lsGet('jg-' + name, []), pending: lsGet('jg-p-' + name, {}), onchange: null };
    S.list = function () { return S.items.filter(function (x) { return !x.del; }); };
    S.get = function (id) { return S.items.find(function (x) { return x.id === id && !x.del; }); };
    S.saveLocal = function () { lsSet('jg-' + name, S.items); lsSet('jg-p-' + name, S.pending); };
    S.apply = function (list) {
      var map = new Map();
      (list || []).forEach(function (x) { if (x && x.id) map.set(x.id, x); });
      Object.keys(S.pending).forEach(function (k) {
        var p = S.pending[k], o = map.get(k);
        if (!o || (p.updated || 0) >= (o.updated || 0)) map.set(k, p);
      });
      S.items = Array.from(map.values());
      S.saveLocal();
      if (S.onchange) S.onchange();
    };
    S.pull = async function () {
      var r = await fetch(API + '/data/' + name, { headers: H, cache: 'no-store' });
      if (!r.ok) throw new Error('pull');
      S.apply(await r.json());
    };
    S.flush = async function () {
      var items = Object.keys(S.pending).map(function (k) { return S.pending[k]; });
      if (!items.length) return;
      var r = await fetch(API + '/data/' + name, {
        method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, H),
        body: JSON.stringify({ items: items })
      });
      if (!r.ok) throw new Error('flush');
      var list = await r.json();
      items.forEach(function (it) { if (S.pending[it.id] && S.pending[it.id].updated === it.updated) delete S.pending[it.id]; });
      S.apply(list);
    };
    S.put = async function (it) {
      it.updated = Date.now();
      var i = S.items.findIndex(function (x) { return x.id === it.id; });
      if (i >= 0) S.items[i] = it; else S.items.push(it);
      S.pending[it.id] = it;
      S.saveLocal();
      if (S.onchange) S.onchange();
      try { await S.flush(); } catch (e) { toast('인터넷이 연결되면 자동으로 저장됩니다'); }
    };
    return S;
  }
  var MN = makeStore('mn');
  var PK = makeStore('pak');

  // 예전 팍팍 단어를 서버로 한 번 옮기기
  if (!localStorage.getItem('jg-migrated')) {
    var old = lsGet('vocab-words-v2', []);
    if (Array.isArray(old)) old.forEach(function (w) {
      if (!w || !w.id) return;
      var it = { id: w.id, title: w.title || '', body: w.body || '', created: w.created || Date.now(), updated: w.updated || Date.now() };
      PK.pending[it.id] = it;

    if (C.drag >= 0) {
      var p = C.pts[C.drag], R = Math.min(60, CW / 5), z = 3;
      var cx = p[0] * s < CW / 2 ? CW - R - 6 : R + 6, cy = R + 6, sw = 2 * R / (s * z);
      ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = '#000'; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R);
      ctx.drawImage(src, p[0] - sw / 2, p[1] - sw / 2, sw, sw, cx - R, cy - R, 2 * R, 2 * R);
      ctx.strokeStyle = '#ff3b30'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();
      ctx.restore();
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }
  }
  (function () {
    var cv = $('cv');
    function pos(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / C.s, (e.clientY - r.top) / C.s]; }
    cv.addEventListener('pointerdown', function (e) {
      if (!C) return;
      var p = pos(e), best = -1, bd = 44 / C.s;
      C.pts.forEach(function (q, i) { var d = Math.hypot(q[0] - p[0], q[1] - p[1]); if (d < bd) { bd = d; best = i; } });
      if (best < 0) return;
      C.drag = best; cv.setPointerCapture(e.pointerId); e.preventDefault(); drawCrop();
    });
    cv.addEventListener('pointermove', function (e) {
      if (!C || C.drag < 0) return;
      var p = pos(e);
      C.pts[C.drag] = [Math.max(0, Math.min(C.src.width, p[0])), Math.max(0, Math.min(C.src.height, p[1]))];
      drawCrop();
    });
    function up() { if (C && C.drag >= 0) { C.drag = -1; drawCrop(); } }
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
  })();
  function solve8(A, b) {
    for (var i = 0; i < 8; i++) {
      var m = i;
      for (var r = i + 1; r < 8; r++) if (Math.abs(A[r][i]) > Math.abs(A[m][i])) m = r;
      var tA = A[i]; A[i] = A[m]; A[m] = tA; var tb = b[i]; b[i] = b[m]; b[m] = tb;
      var p = A[i][i];
      if (Math.abs(p) < 1e-10) return null;
      for (r = 0; r < 8; r++) {
        if (r === i) continue;
        var f = A[r][i] / p;
        if (!f) continue;
        for (var c = i; c < 8; c++) A[r][c] -= f * A[i][c];
        b[r] -= f * b[i];
      }
    }
    return b.map(function (v, i) { return v / A[i][i]; });
  }
  function warp() {
    var P = C.pts;
    function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }
    var ow = (dist(P[0], P[1]) + dist(P[3], P[2])) / 2, oh = (dist(P[0], P[3]) + dist(P[1], P[2])) / 2;
    if (ow < 10 || oh < 10) return null;
    var k = Math.min(1, 1200 / Math.max(ow, oh));
    ow = Math.round(ow * k); oh = Math.round(oh * k);
    var D = [[0, 0], [ow, 0], [ow, oh], [0, oh]], A = [], b = [];
    for (var i = 0; i < 4; i++) {
      var u = D[i][0], v = D[i][1], x = P[i][0], y = P[i][1];
      A.push([u, v, 1, 0, 0, 0, -u * x, -v * x]); b.push(x);
      A.push([0, 0, 0, u, v, 1, -u * y, -v * y]); b.push(y);
    }
    var h = solve8(A, b);
    if (!h) return null;
    var SW = C.src.width, SH = C.src.height;
    var sd = C.src.getContext('2d').getImageData(0, 0, SW, SH).data;
    var out = document.createElement('canvas'); out.width = ow; out.height = oh;
    var octx = out.getContext('2d'), od = octx.createImageData(ow, oh), o = od.data, j = 0;
    for (var vv = 0; vv < oh; vv++) {
      for (var uu = 0; uu < ow; uu++) {
        var U = uu + .5, Vv = vv + .5, den = h[6] * U + h[7] * Vv + 1;
        var X = (h[0] * U + h[1] * Vv + h[2]) / den - .5, Y = (h[3] * U + h[4] * Vv + h[5]) / den - .5;
        if (X < 0) X = 0; if (Y < 0) Y = 0; if (X > SW - 1) X = SW - 1; if (Y > SH - 1) Y = SH - 1;
        var x0 = X | 0, y0 = Y | 0, x1 = Math.min(x0 + 1, SW - 1), y1 = Math.min(y0 + 1, SH - 1), fx = X - x0, fy = Y - y0;
        var a = (y0 * SW + x0) * 4, bb = (y0 * SW + x1) * 4, c = (y1 * SW + x0) * 4, d = (y1 * SW + x1) * 4;
        for (var chn = 0; chn < 3; chn++) {
          o[j + chn] = (sd[a + chn] * (1 - fx) + sd[bb + chn] * fx) * (1 - fy) + (sd[c + chn] * (1 - fx) + sd[d + chn] * fx) * fy;
        }
        o[j + 3] = 255; j += 4;
      }
    }
    octx.putImageData(od, 0, 0);
    return out;
  }
  function usePhoto(canvas) {
    canvas.toBlob(function (blob) {
      if (!blob) { toast('사진을 만들지 못했습니다'); return; }
      if (E.blobUrl) URL.revokeObjectURL(E.blobUrl);
      E.blob = blob; E.blobUrl = URL.createObjectURL(blob); E.delPhoto = false;
      C = null;
      $('cdlg').close();
      renderPhotoSlot(E.id ? MN.get(E.id) : null);
    }, 'image/jpeg', 0.85);
  }
  $('c-ok').addEventListener('click', function () {
    var b = $('c-ok'); b.textContent = '처리 중…';
    setTimeout(function () {
      var out = warp();
      b.textContent = '완료';
      if (!out) { toast('점이 너무 가깝거나 꼬였습니다. 다시 맞춰 주세요'); return; }
      usePhoto(out);
    }, 30);
  });
  $('c-raw').addEventListener('click', function () {
    var W = C.src.width, Hh = C.src.height, k = Math.min(1, 1200 / Math.max(W, Hh)), c = document.createElement('canvas');
    c.width = Math.round(W * k); c.height = Math.round(Hh * k);
    c.getContext('2d').drawImage(C.src, 0, 0, c.width, c.height);
    usePhoto(c);
  });
  $('c-full').addEventListener('click', function () {
    var W = C.src.width, Hh = C.src.height;
    C.pts = [[0, 0], [W, 0], [W, Hh], [0, Hh]]; drawCrop();
  });
  $('c-back').addEventListener('click', function () { C = null; $('cdlg').close(); });
  $('cdlg').addEventListener('cancel', function (e) { e.preventDefault(); C = null; $('cdlg').close(); });

  /* ================= 팍팍 (처음 기능 그대로) ================= */
  var editingId = null;
  var delArmed = false;
  var grid = $('grid'), emptyEl = $('empty');
  var dlg = $('dlg');

  function sorted(list) {
    var cmp = {
      az: function (a, b) { return a.title.toLowerCase().localeCompare(b.title.toLowerCase(), 'en'); },
      za: function (a, b) { return b.title.toLowerCase().localeCompare(a.title.toLowerCase(), 'en'); },
      created: function (a, b) { return (a.created || 0) - (b.created || 0); },
      updated: function (a, b) { return (b.updated || 0) - (a.updated || 0); }
    }[$('sort').value];
    return list.slice().sort(cmp);
  }
  function matches(w, q) {
    if (!q) return true;
    return (w.title + '\n' + w.body).toLowerCase().indexOf(q.toLowerCase()) >= 0;
  }
  function cardFor(w) {
    var c = document.createElement('button');
    c.type = 'button'; c.className = 'card';
    var h = document.createElement('h3'); h.textContent = w.title; c.appendChild(h);
    var b = document.createElement('div'); b.className = 'body'; b.textContent = w.body; c.appendChild(b);
    c.addEventListener('click', function () { openEditor(w); });
    return c;
  }
  function render() {
    var words = PK.list();
    var q = $('q').value.trim();
    var list = sorted(words.filter(function (w) { return matches(w, q); }));
    grid.textContent = '';
    list.forEach(function (w) { grid.appendChild(cardFor(w)); });
    if (!list.length) {
      emptyEl.hidden = false;
      emptyEl.textContent = words.length ? '검색 결과가 없습니다.' : '메모가 없습니다.\n오른쪽 아래 + 버튼으로 추가하세요.';
    } else { emptyEl.hidden = true; }
  }
  PK.onchange = render;

  function grow() {
    var t = $('f-body');
    t.style.height = 'auto';
    t.style.height = Math.max(t.scrollHeight, Math.round(window.innerHeight * 0.6)) + 'px';
  }
  function openEditor(w) {
    editingId = w ? w.id : null;
    $('f-title').value = w ? w.title : '';
    $('f-body').value = w ? w.body : '';
    $('err').textContent = '';
    delArmed = false;
    $('del').textContent = '삭제';
    $('del').style.visibility = w ? 'visible' : 'hidden';
    dlg.showModal();
    $('edit').scrollTop = 0;
    grow();
    if (!w) $('f-title').focus();
  }
  async function saveAndClose() {
    var title = $('f-title').value.trim();
    var body = $('f-body').value.replace(/\s+$/, '');
    if (!title && !body) { dlg.close(); return; }
    if (!title) { $('err').textContent = '제목(단어)을 입력해 주세요.'; $('f-title').focus(); return; }
    var now = Date.now();
    var old = editingId ? PK.get(editingId) : null;
    var w = { id: old ? old.id : newId('w'), title: title, body: body, created: old ? (old.created || now) : now };
    var changed = !old || old.title !== w.title || old.body !== w.body;
    dlg.close();
    if (changed) await PK.put(w);
  }
  $('back').addEventListener('click', saveAndClose);
  dlg.addEventListener('cancel', function (ev) { ev.preventDefault(); saveAndClose(); });
  $('f-body').addEventListener('input', grow);
  $('del').addEventListener('click', async function () {
    if (!editingId) return;
    if (!delArmed) { delArmed = true; $('del').textContent = '정말 삭제'; return; }
    var w = PK.get(editingId);
    dlg.close();
    if (w) await PK.put(Object.assign({}, w, { del: true }));
  });
  $('q').addEventListener('input', render);
  $('sort').addEventListener('change', function () {
    try { localStorage.setItem('vocab-sort', $('sort').value); } catch (e) {}
    render();
  });
  try {
    var s = localStorage.getItem('vocab-sort');
    if (s && ['az', 'za', 'created', 'updated'].indexOf(s) >= 0) $('sort').value = s;
  } catch (e) {}

  /* ================= 시작 ================= */
  setTab('mn');
  renderMn();
  render();
  sync();
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') sync(true); });
  window.addEventListener('online', function () { sync(true); });
})();
</script>

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
